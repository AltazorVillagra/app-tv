<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1014">
  <meta name="description" content="Mis canales en vivo: TV e IPTV en el celular">
  <title>Mi TV</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="iconos/icono-192.png">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <link rel="stylesheet" href="estilos.css">
  <script>
    // Guarda los errores de canales.js para mostrarlos en pantalla
    window.__errores = [];
    window.addEventListener("error", function (e) { window.__errores.push(e); });
  </script>
</head>
<body>

  <header class="barra">
    <h1 class="marca"><span class="marca-icono" aria-hidden="true"></span>Mi TV</h1>
    <button id="btn-favoritos" class="chip" type="button" aria-pressed="false">☆ Favoritos</button>
  </header>

  <!-- Reproductor: aparece al tocar un canal -->
  <section id="reproductor" class="reproductor" hidden>
    <div class="pantalla">
      <video id="video" controls playsinline></video>
      <div id="marco" class="marco" hidden></div>
      <div id="radio" class="radio" hidden>
        <div class="ondas" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <p id="radio-nombre"></p>
        <span>Solo audio</span>
      </div>
      <div id="cargando" class="cargando" hidden><div class="rueda"></div></div>
      <div id="aviso" class="aviso" hidden></div>
    </div>
    <div class="info">
      <div class="info-texto">
        <strong id="titulo"></strong>
        <span id="subtitulo"></span>
      </div>
      <button id="btn-cerrar" class="cerrar" type="button" aria-label="Cerrar reproductor">✕</button>
    </div>
  </section>

  <main id="lista" class="lista"></main>

  <footer class="pie">
    Para agregar canales edita <code>canales.js</code>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script src="canales.js"></script>
  <script src="app.js"></script>
</body>
</html>
